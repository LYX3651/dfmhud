name: build-tipa

# 本账号的 macOS runner 无法分配（runner='' + 2s cancelled），
# 改走 ubuntu + Theos 官方 Linux 交叉编译路径。
# 注意：不用 theos 的 install-theos 安装器 —— 它要装 libxml2，
# 而 ubuntu-26.04 已经移除该包名（只有 libxml2-dev），会让安装器 exit 3。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang lld libc++-dev libc++abi-dev \
            git curl sudo unzip zip \
            libssl-dev libxml2-dev libplist-dev libplist++-dev \
            pkg-config fakeroot dpkg rpm zstd xz-utils \
            make autoconf automake libtool
          echo "--- 版本 ---"
          clang --version | head -2
          make --version | head -1

      - name: 安装 Theos（手动，绕过安装器的 libxml2 检查）
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          ls "$THEOS" | head -20
          test -f "$THEOS/makefiles/application.mk" && echo "application.mk OK"

      - name: 安装 iOS SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone '/*.sdk'
          ls -d *.sdk 2>/dev/null | head -20
          cp -R *.sdk "$THEOS/sdks/" 2>/dev/null || true
          echo "--- 已安装 SDK ---"
          ls "$THEOS/sdks" | head -20

      - name: 安装 Linux 交叉工具链
        run: |
          export THEOS=$HOME/theos
          mkdir -p "$THEOS/toolchain/linux/iphone"
          # Theos 官方 linux toolchain
          URL="https://github.com/L1ghtmann/theos-toolchain-linux/releases/latest/download/toolchain-linux.tar.xz"
          echo "trying $URL"
          if curl -fsSL -o /tmp/tc.tar.xz "$URL"; then
            echo "downloaded $(stat -c%s /tmp/tc.tar.xz) bytes"
            tar -xJf /tmp/tc.tar.xz -C "$THEOS/toolchain/linux/iphone" --strip-components=1 || \
            tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain/linux/iphone" --strip-components=1
            ls "$THEOS/toolchain/linux/iphone" | head
            find "$THEOS/toolchain/linux/iphone" -maxdepth 3 -name "clang*" | head -3
          else
            echo "!! toolchain 下载失败，稍后用系统 clang"
          fi

      - name: 安装 ldid
        run: |
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          git submodule update --init --recursive --depth 1
          make -j"$(nproc)" 2>&1 | tail -15
          sudo install -m755 ./ldid /usr/local/bin/ldid
          ldid -h 2>&1 | head -3 || true

      - name: 拉 ImGui
        run: |
          git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git third_party_imgui
          ls third_party_imgui/imgui.h third_party_imgui/backends/imgui_impl_metal.mm

      - name: 环境汇总
        run: |
          echo "THEOS=$THEOS"
          echo "--- sdks ---"; ls "$THEOS/sdks" 2>/dev/null | head
          echo "--- toolchain ---"; ls "$THEOS/toolchain/linux/iphone/bin" 2>/dev/null | head
          echo "--- ldid ---"; ldid -h 2>&1 | head -2
          echo "--- env ---"
          echo "PATH=$PATH"

      - name: 编译
        run: |
          chmod +x build.sh tools/pack_tipa.sh
          set +e
          ./build.sh 2>&1 | tee build.log
          rc=$?
          echo "BUILD_RC=$rc"
          exit 0

      - name: 结果
        run: |
          echo "=== 产物 ==="
          ls -lh DFMHUD.tipa 2>/dev/null || echo "(无 tipa)"
          echo "=== 日志尾部 ==="
          tail -100 build.log 2>/dev/null || echo "(无日志)"

      - name: 上传 tipa
        if: hashFiles('DFMHUD.tipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: DFMHUD-tipa
          path: DFMHUD.tipa
          if-no-files-found: warn

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
